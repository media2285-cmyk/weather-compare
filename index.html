<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어제오늘">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>어제오늘 날씨</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#ffffff; --text:#1f1f1d; --sub:#6b6a65; --line:#e4e2da;
    --warm:#c2410c; --cold:#1d4ed8; --same:#4b5563; --note-bg:#fff7e6; --note:#8a5a00;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --card:#1f1f1d; --text:#f2f1ec; --sub:#a3a29b; --line:#33332f;
      --warm:#fb923c; --cold:#60a5fa; --same:#cbd5e1; --note-bg:#3a2e14; --note:#f5c86b; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    word-break:keep-all; -webkit-text-size-adjust:100%}
  main{max-width:460px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .place{font-size:15px;color:var(--sub)}
  button{font:inherit;font-size:14px;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:14px}
  .label{font-size:14px;color:var(--sub);margin:0 0 6px}
  .head{font-size:28px;line-height:1.35;font-weight:700;margin:0 0 10px}
  .cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
  .cmp .head{font-size:24px;margin:0}
  .tbl{border-collapse:collapse;font-size:14px;color:var(--sub)}
  .tbl th{font-weight:400;padding:0 0 4px 12px;text-align:right}
  .tbl td{padding:3px 0 3px 12px;text-align:right;white-space:nowrap}
  .tbl td:first-child,.tbl th:first-child{padding-left:0;text-align:left}
  .tbl .on{color:var(--text);font-weight:700}
  .warm{color:var(--warm)} .cold{color:var(--cold)} .same{color:var(--same)}
  .detail{font-size:15px;color:var(--sub);line-height:1.6;margin:0}
  .note{background:var(--note-bg);color:var(--note);border-radius:12px;padding:10px 12px;
    font-size:14px;line-height:1.5;margin-top:12px}
  .msg{text-align:center;color:var(--sub);padding:48px 8px;line-height:1.7}
  .foot{font-size:12px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.6}
  .foot a{color:var(--sub)}
  .now{display:flex;align-items:center;gap:16px;padding:6px 4px 18px}
  .now svg{width:72px;height:72px;flex:none}
  .now-temp{font-size:40px;font-weight:700;line-height:1}
  .now-desc{font-size:16px;color:var(--sub);margin-top:6px}
  .precip{display:flex;align-items:center;gap:8px;background:var(--rain-bg);color:var(--rain);
    border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5;margin-top:12px}
  .precip svg{width:22px;height:22px;flex:none}
  .commute{display:flex;align-items:center;gap:8px;background:var(--rain);color:var(--card);
    border-radius:12px;padding:10px 12px;font-size:16px;font-weight:700;line-height:1.4;margin-top:12px}
  .commute.weak{background:var(--rain-bg);color:var(--rain)}
  .commute svg{width:22px;height:22px;flex:none}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
  .week span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .week span.today{color:var(--text);font-weight:700}
  .week svg{width:34px;height:34px}
  .loading{text-align:center;padding:56px 8px;color:var(--sub)}
  .ld{position:relative;width:72px;height:72px;margin:0 auto 16px}
  .ld svg{position:absolute;inset:0;width:72px;height:72px;opacity:0;animation:ldcycle 2.4s infinite}
  .ld svg:nth-child(2){animation-delay:.6s}.ld svg:nth-child(3){animation-delay:1.2s}.ld svg:nth-child(4){animation-delay:1.8s}
  @keyframes ldcycle{0%{opacity:0;transform:scale(.85)}6%,22%{opacity:1;transform:scale(1)}28%,100%{opacity:0;transform:scale(.85)}}
  :root{--rain-bg:#e8f0fe;--rain:#1e40af;--sun:#f59e0b;--cloud:#9ca3af;--drop:#3b82f6;--snow:#60a5fa;--bolt:#eab308}
  @media (prefers-color-scheme: dark){:root{--rain-bg:#1b2a4a;--rain:#a5c4ff;--cloud:#6b7280}}
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="place" id="place">현재 위치</span>
    <button id="refresh" type="button">새로고침</button>
  </div>
  <div id="content"></div>
  <p class="foot" id="foot"></p>
</main>

<script>
(function(){
  var $content = document.getElementById('content');
  var $place = document.getElementById('place');
  var $foot = document.getElementById('foot');
  var LS_KEY = 'yt-weather-last-pos';

  function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function r1(n){ return Math.round(n * 10) / 10; }
  function deg(n){ return Math.round(n) + '°'; }

  // 일평균: 그날 0~23시 시간별 기온의 평균
  function dailyMeans(hourly, dates){
    var sums = {}, counts = {};
    hourly.time.forEach(function(t, i){
      var d = t.slice(0, 10), v = hourly.temperature_2m[i];
      if (v == null) return;
      sums[d] = (sums[d] || 0) + v; counts[d] = (counts[d] || 0) + 1;
    });
    return dates.map(function(d){ return counts[d] ? sums[d] / counts[d] : null; });
  }

  // 비교 문장 만들기: diff = 기준일 대비 차이(일평균)
  function phrase(diff, meanNow){
    // 예보 오차(1~2°)보다 작은 차이는 체감하기 어려우므로 2° 미만은 '비슷해요'
    if (Math.abs(diff) < 2) return { cls:'same', text:'비슷해요', same:true };
    var d = Math.round(diff);
    if (d > 0) return { cls:'warm', text: d + '° ' + (meanNow >= 23 ? '더 더워요' : '따뜻해요') };
    return { cls:'cold', text: Math.abs(d) + '° ' + (meanNow >= 23 ? '덜 더워요' : '추워요') };
  }

  // 일교차 안내: 최고·최저가 반대 방향으로 2° 이상씩 움직이면 평균만으론 안 보이니 따로 알림
  function rangeNote(dMax, dMin, who){
    if (dMax >= 2 && dMin <= -2)
      return who + ' 일교차가 커요 (최고 +' + Math.round(dMax) + '°, 최저 ' + Math.round(dMin) + '°)';
    if (dMax <= -2 && dMin >= 2)
      return who + ' 일교차가 작아요 (최고 ' + Math.round(dMax) + '°, 최저 +' + Math.round(dMin) + '°)';
    return '';
  }

  // ---------- 날씨 아이콘 (WMO weather code 기준) ----------
  var SUN = '<circle cx="32" cy="32" r="11" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="4" stroke-linecap="round"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M15 49l4-4M45 19l4-4"/></g>';
  var MOON = '<path d="M40 12a20 20 0 1 0 12 30A16 16 0 0 1 40 12z" fill="var(--sun)"/>';
  var CLOUD = '<path d="M20 48h26a10 10 0 0 0 0-20 14 14 0 0 0-27-2 11 11 0 0 0 1 22z" fill="var(--cloud)"/>';
  var CLOUD_HI = '<path d="M20 40h26a10 10 0 0 0 0-20 14 14 0 0 0-27-2 11 11 0 0 0 1 22z" fill="var(--cloud)"/>';
  var SMALL_SUN = '<g transform="translate(-6,-6) scale(.75)">' + SUN + '</g>';
  var SMALL_MOON = '<g transform="translate(-4,-6) scale(.7)">' + MOON + '</g>';
  var DROPS = '<g stroke="var(--drop)" stroke-width="4" stroke-linecap="round"><path d="M24 46l-3 8M34 46l-3 8M44 46l-3 8"/></g>';
  var FLAKES = '<g fill="var(--snow)"><circle cx="22" cy="51" r="3.2"/><circle cx="33" cy="55" r="3.2"/><circle cx="44" cy="51" r="3.2"/></g>';
  var BOLT = '<path d="M34 40l-8 12h7l-3 10 11-14h-7l4-8z" fill="var(--bolt)"/>';
  var FOG = '<g stroke="var(--cloud)" stroke-width="4" stroke-linecap="round"><path d="M14 46h36M18 54h28"/></g>';

  function svg(inner){ return '<svg viewBox="0 0 64 64" aria-hidden="true">' + inner + '</svg>'; }
  function isSnowCode(c){ return (c >= 71 && c <= 77) || c === 85 || c === 86; }
  function isPrecipCode(c){ return (c >= 51 && c <= 67) || (c >= 71 && c <= 77) || (c >= 80 && c <= 86) || c >= 95; }

  function weatherInfo(code, isDay){
    var c = code;
    if (c === 0) return { name: '맑음', icon: svg(isDay ? SUN : MOON) };
    if (c === 1 || c === 2) return { name: '구름 조금', icon: svg((isDay ? SMALL_SUN : SMALL_MOON) + '<g transform="translate(4,8)">' + CLOUD_HI.replace('M20 40','M20 40') + '</g>') };
    if (c === 3) return { name: '흐림', icon: svg(CLOUD) };
    if (c === 45 || c === 48) return { name: '안개', icon: svg(CLOUD_HI + FOG) };
    if (c >= 95) return { name: '뇌우', icon: svg(CLOUD_HI + BOLT) };
    if (isSnowCode(c)) return { name: c === 77 ? '싸락눈' : '눈', icon: svg(CLOUD_HI + FLAKES) };
    if (c === 66 || c === 67) return { name: '진눈깨비', icon: svg(CLOUD_HI + '<g stroke="var(--drop)" stroke-width="4" stroke-linecap="round"><path d="M24 46l-3 8M44 46l-3 8"/></g><circle cx="33" cy="53" r="3.2" fill="var(--snow)"/>') };
    if (c >= 51 && c <= 57) return { name: '이슬비', icon: svg(CLOUD_HI + DROPS) };
    if ((c >= 61 && c <= 65) || (c >= 80 && c <= 82)) return { name: (c === 65 || c === 82) ? '강한 비' : '비', icon: svg(CLOUD_HI + DROPS) };
    return { name: '흐림', icon: svg(CLOUD) };
  }

  // ---------- 비·눈 시간대 ----------
  // 한 시간이라도 강수량 0.1mm 이상이거나 날씨코드가 비·눈이면 '오는 시간'으로 봄
  function precipRanges(hourly, date, fromHour){
    var hrs = [];
    hourly.time.forEach(function(t, i){
      if (t.slice(0, 10) !== date) return;
      var h = parseInt(t.slice(11, 13), 10);
      if (h < fromHour) return;
      var code = hourly.weather_code[i], p = hourly.precipitation[i] || 0, sf = hourly.snowfall ? (hourly.snowfall[i] || 0) : 0;
      if (p >= 0.1 || isPrecipCode(code)) hrs.push({ h: h, snow: sf > 0 || isSnowCode(code) });
    });
    var out = [];
    hrs.forEach(function(x){
      var last = out[out.length - 1];
      if (last && last.end === x.h){ last.end = x.h + 1; last.snow = last.snow || x.snow; last.rain = last.rain || !x.snow; }
      else out.push({ start: x.h, end: x.h + 1, snow: x.snow, rain: !x.snow });
    });
    return out;
  }

  // ---------- 출퇴근길 비 ----------
  var AM = [8], PM = [18, 19];          // 출근 8~9시, 퇴근 18~20시
  var ALLDAY = [8, 19];                  // 이 사이가 모두 비면 '하루 종일 비'
  function hourInfo(hourly, date){
    var m = {};
    hourly.time.forEach(function(t, i){
      if (t.slice(0, 10) !== date) return;
      var c = hourly.weather_code[i], p = hourly.precipitation[i] || 0;
      var prob = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
      m[parseInt(t.slice(11, 13), 10)] = {
        sure: isPrecipCode(c) || p >= 0.1,
        prob: prob == null ? 0 : prob,
        snow: isSnowCode(c) || (hourly.snowfall && hourly.snowfall[i] > 0),
        temp: hourly.temperature_2m[i]
      };
    });
    return m;
  }
  function judge(m, hours){
    var sure = false, prob = 0, any = false, snow = false, temps = [];
    hours.forEach(function(h){
      var x = m[h]; if (!x) return;
      if (x.sure) sure = true;
      if (x.prob > prob) prob = x.prob;
      if (x.sure || x.prob >= 50){ any = true; if (x.snow) snow = true; }
      if (!x.sure && x.prob >= 50 && x.temp != null) temps.push(x.temp);
    });
    return { hit: any, sure: sure, prob: prob, snow: snow, temps: temps };
  }
  function commuteHTML(hourly, date, nowHour){
    var m = hourInfo(hourly, date);
    var amOpen = nowHour == null || nowHour < 9, pmOpen = nowHour == null || nowHour < 20;
    var am = amOpen ? judge(m, AM) : { hit:false }, pm = pmOpen ? judge(m, PM) : { hit:false };
    if (!am.hit && !pm.hit) return '';
    var allHours = []; for (var h = ALLDAY[0]; h <= ALLDAY[1]; h++) allHours.push(h);
    var allDay = amOpen && allHours.every(function(h){ var x = m[h]; return x && (x.sure || x.prob >= 50); });
    var sure = allDay ? true : (am.hit && am.sure) || (pm.hit && pm.sure);
    var word;
    if (sure){
      word = ((am.hit && am.snow) || (pm.hit && pm.snow)) ? '눈' : '비';
    } else {
      // 강수확률만 있는 경우: 기온으로 종류 추정 (0° 이하 눈, 0~3° 비·눈, 3° 초과 비)
      var temps = (am.hit ? am.temps : []).concat(pm.hit ? pm.temps : []);
      var lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
      word = !temps.length ? '비' : hi <= 0 ? '눈' : lo > 3 ? '비' : '비·눈';
    }
    var text;
    if (allDay) text = '하루 종일 ' + word;
    else if (am.hit && pm.hit) text = '출퇴근길 모두 ' + word;
    else if (am.hit) text = '출근길 ' + word + ' (8~9시)';
    else text = '퇴근길 ' + word + ' (18~20시)';
    var maxProb = Math.max(am.prob || 0, pm.prob || 0);
    if (!sure) text = text.replace(' (', ' 가능성 (') + (text.indexOf('(') < 0 ? ' 가능성' : '');
    if (!sure) text += ' · ' + maxProb + '%';
    var umbrella = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 18 0z" fill="currentColor"/><path d="M12 12v7a2 2 0 0 1-4 0"/></svg>';
    return '<div class="commute' + (sure ? '' : ' weak') + '">' + umbrella + '<span>' + text + '</span></div>';
  }

  function precipHTML(ranges, nowHour){
    if (!ranges.length) return '';
    var snow = ranges.some(function(r){ return r.snow; }), rain = ranges.some(function(r){ return r.rain; });
    var kind = snow && rain ? '비·눈' : snow ? '눈' : '비';
    var txt = ranges.map(function(r){
      var s = (nowHour != null && r.start === nowHour) ? '지금' : r.start + '시';
      var e = r.end === 24 ? '자정' : r.end + '시';
      return s + '~' + e;
    }).join(', ');
    var icon = snow && !rain ? svg(CLOUD_HI + FLAKES) : svg(CLOUD_HI + DROPS);
    return '<div class="precip">' + icon + '<span><b>' + kind + '</b> · ' + txt + '</span></div>';
  }

  // 낮(9~18시) 대표 날씨: 비·눈이 3시간 이상이면 비·눈, 아니면 가장 많이 나온 날씨
  function dayCode(hourly, date, fallback){
    var precip = {}, sky = {}, pHours = 0;
    hourly.time.forEach(function(t, i){
      if (t.slice(0, 10) !== date) return;
      var h = parseInt(t.slice(11, 13), 10);
      if (h < 9 || h >= 18) return;
      var c = hourly.weather_code[i], p = hourly.precipitation[i] || 0;
      if (isPrecipCode(c) || p >= 0.1){
        pHours++;
        var pc = isPrecipCode(c) ? c : ((hourly.snowfall && hourly.snowfall[i] > 0) ? 71 : 61);
        precip[pc] = (precip[pc] || 0) + 1;
      } else sky[c] = (sky[c] || 0) + 1;
    });
    function top(o){ var b = null; Object.keys(o).forEach(function(k){ if (b === null || o[k] > o[b]) b = k; }); return b === null ? null : +b; }
    if (pHours >= 3) return top(precip);
    var s = top(sky);
    return s === null ? fallback : s;
  }

  function weekHTML(dates, codes, hourly, nowCode, nowIsDay){
    if (!codes || dates.length < 2) return '';
    var wk = ['일','월','화','수','목','금','토'];
    var cells = dates.slice(0, 7).map(function(d, i){
      var dt = new Date(d + 'T00:00:00');
      var label = i === 0 ? '오늘' : i === 1 ? '내일' : wk[dt.getDay()];
      var code = i === 0 ? nowCode : dayCode(hourly, d, codes[i]);
      return '<div><span' + (i === 0 ? ' class="today"' : '') + '>' + label + '</span>' + weatherInfo(code, i === 0 ? nowIsDay : true).icon + '</div>';
    }).join('');
    return '<section class="card"><p class="label">7일 날씨</p><div class="week">' + cells + '</div></section>';
  }

  function headline(subject, base, ph){
    return '<p class="head">' + subject + ' ' + base + (ph.same ? (base === '어제' ? '와' : '과') : '보다') +
      '<br><span class="' + ph.cls + '">' + ph.text + '</span></p>';
  }
  function cmpTable(aName, bName, a, b){
    function row(label, x, y){ return '<tr><td>' + label + '</td><td>' + x + '</td><td class="on">' + y + '</td></tr>'; }
    return '<table class="tbl"><tr><th></th><th>' + aName + '</th><th class="on">' + bName + '</th></tr>' +
      row('최저', deg(a.min), deg(b.min)) + row('최고', deg(a.max), deg(b.max)) +
      row('일평균', r1(a.mean) + '°', r1(b.mean) + '°') + '</table>';
  }
  function dateLabel(date, word){
    var d = new Date(date + 'T00:00:00');
    return '<p class="label">' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + ['일','월','화','수','목','금','토'][d.getDay()] + ') · ' + word + '</p>';
  }

  function render(data){
    var dly = data.daily;
    var dates = dly.time; // [어제, 오늘, 내일]
    var max = dly.temperature_2m_max, min = dly.temperature_2m_min;
    var mean = dailyMeans(data.hourly, dates.slice(0, 3));
    if (dates.length < 3 || mean.length < 3 || mean.indexOf(null) !== -1) throw new Error('데이터가 부족해요');

    var t = phrase(mean[1] - mean[0], mean[1]);
    var n = phrase(mean[2] - mean[1], mean[2]);
    var noteT = rangeNote(max[1] - max[0], min[1] - min[0], '어제보다');
    var noteN = rangeNote(max[2] - max[1], min[2] - min[1], '오늘보다');


    var cur = data.current;
    var info = weatherInfo(cur.weather_code, cur.is_day === 1);
    var nowHour = parseInt(cur.time.slice(11, 13), 10);
    var precipToday = precipHTML(precipRanges(data.hourly, dates[1], nowHour), nowHour);
    var precipTomorrow = precipHTML(precipRanges(data.hourly, dates[2], 0), null);

    $content.innerHTML =
      '<div class="now">' + info.icon +
        '<div><div class="now-temp">' + deg(cur.temperature_2m) + '</div>' +
        '<div class="now-desc">지금 ' + info.name + '</div></div>' +
      '</div>' +
      '<section class="card">' +
        dateLabel(dates[1], '오늘') +
        '<div class="cmp">' + headline('오늘은', '어제', t) +
          cmpTable('어제', '오늘', { min:min[0], max:max[0], mean:mean[0] }, { min:min[1], max:max[1], mean:mean[1] }) + '</div>' +
        commuteHTML(data.hourly, dates[1], nowHour) +
        precipToday +
        (noteT ? '<div class="note">' + esc(noteT) + '</div>' : '') +
      '</section>' +
      '<section class="card">' +
        dateLabel(dates[2], '내일') +
        '<div class="cmp">' + headline('내일은', '오늘', n) +
          cmpTable('오늘', '내일', { min:min[1], max:max[1], mean:mean[1] }, { min:min[2], max:max[2], mean:mean[2] }) + '</div>' +
        commuteHTML(data.hourly, dates[2], null) +
        precipTomorrow +
        (noteN ? '<div class="note">' + esc(noteN) + '</div>' : '') +
      '</section>' +
      weekHTML(dates.slice(1), dly.weather_code.slice(1), data.hourly, cur.weather_code, cur.is_day === 1);

    var now = new Date();
    $foot.innerHTML = '비교 기준: 하루 24시간 평균기온 · ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + ' 업데이트<br>' +
      '날씨 데이터 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>';
  }

  function showError(msg){
    $content.innerHTML = '<p class="msg">' + esc(msg).replace(/\n/g, '<br>') + '</p>';
  }

  function fetchWeather(lat, lon){
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code,is_day' +
      '&daily=temperature_2m_max,temperature_2m_min,weather_code&hourly=temperature_2m,precipitation,precipitation_probability,snowfall,weather_code' +
      '&past_days=1&forecast_days=7&timezone=auto';
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error('날씨 서버 응답 오류 (' + r.status + ')');
      return r.json();
    });
  }

  function run(lat, lon){
    lat = Math.round(lat * 100) / 100; lon = Math.round(lon * 100) / 100;
    fetchWeather(lat, lon).then(render).catch(function(e){
      showError('날씨를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.\n(' + e.message + ')');
    });
  }

  function showLoading(){
    $content.innerHTML = '<div class="loading"><div class="ld">' +
      weatherInfo(0, true).icon + weatherInfo(3, true).icon + weatherInfo(61, true).icon + weatherInfo(73, true).icon +
      '</div>날씨를 가져오는 중이에요</div>';
  }

  var POS_TTL = 0; // 0이면 매번 위치를 새로 잡음 (위치 재사용하려면 예: 60 * 60 * 1000 = 1시간)

  function start(force){
    showLoading();
    var last = load(LS_KEY);
    if (!force && last && last.t && (Date.now() - last.t) < POS_TTL){
      $place.textContent = '현재 위치';
      return run(last.lat, last.lon);
    }
    $place.textContent = '위치 확인 중…';
    if (!('geolocation' in navigator)){
      if (last){ $place.textContent = '마지막 위치'; return run(last.lat, last.lon); }
      $place.textContent = '위치 없음';
      return showError('이 브라우저는 위치 기능을 지원하지 않아요.');
    }
    navigator.geolocation.getCurrentPosition(function(p){
      var pos = { lat: p.coords.latitude, lon: p.coords.longitude, t: Date.now() };
      store(LS_KEY, pos);
      $place.textContent = '현재 위치';
      run(pos.lat, pos.lon);
    }, function(err){
      if (last){ $place.textContent = '마지막 위치'; return run(last.lat, last.lon); }
      $place.textContent = '위치 없음';
      showError(err.code === 1
        ? '위치 권한이 꺼져 있어요. 휴대폰 설정에서 이 사이트의 위치 접근을 허용한 뒤 새로고침해 주세요.'
        : '위치를 확인하지 못했어요. 잠시 뒤 새로고침해 주세요.');
    }, { enableHighAccuracy:false, timeout:10000, maximumAge:30*60*1000 });
  }

  document.getElementById('refresh').addEventListener('click', function(){ start(true); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') start(false); });
  start(false);
})();
</script>
</body>
</html>
